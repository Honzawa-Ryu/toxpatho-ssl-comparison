[project]
name = "template-daily-research-experiments"
version = "0.1.0"
description = "HPC experiment management template for Slurm/PBS-based daily research experiments"
readme = "README.md"
requires-python = "==3.12.*"
# ここは「軽量デフォルト」= jupyter/データ処理/可視化などどの実験でもほぼ使う一式のみ。
# 重いML系(torch/transformers/vllm等)はoptional-dependenciesに分離し、
# tools/uv_sync.sh 側で `uv sync --all-extras` して現状どおり全部入れる
# （個別に軽く済ませたい場合は `uv sync --extra torch --extra nlp` のように選択可能）。
dependencies = [
    "jupyterlab",
    "ipython",
    "matplotlib",
    "notebook",
    "numpy",
    "optuna",
    "pandas",
    "pyyaml",
    "plotly",
    "polars",
    "pyarrow",
    "tqdm",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "slackweb",
    "duckdb",
    "pynvml",
    "psutil",
    "python-dotenv",
    "matplotlib-venn>=1.1.2",
    "h5py>=3.16.0",
    # WSI(.svs等)読み込み。openslide-bin がネイティブライブラリを同梱するため、
    # コンテナ(env.sif)側にlibopenslideが無くても uv sync だけで動く。
    "openslide-python>=1.3.1",
    "openslide-bin",
]

[project.optional-dependencies]
# GPU/深層学習まわり（重い・CUDA依存）
torch = [
    "torch==2.11.0+cu130",
    "torchvision",
    "torchaudio",
    "wandb",
    "accelerate",
    "trl",
    "peft",
    "evaluate",
    "bitsandbytes",
    "safetensors",
    "tokenizers",
    "huggingface-hub",
    "sentencepiece",
]
# NLP・テキスト処理（spacy/scispacy系はモデルダウンロードも重い）
nlp = [
    "transformers",
    "datasets",
    "lxml",
    "cython",
    "spacy",
    "fast-langdetect",
    "scispacy",
]
# 勾配ブースティング系
gbdt = [
    "lightgbm",
    "xgboost",
]
# 大規模データ・分散処理・LLM推論サーバ
serving = [
    "dask",
    "fastparquet",
    "elasticsearch>=8.0.0,<9.0.0",
    "vllm>=0.22.0",
]
dev = [
    "pytest",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# lib をパッケージとして認識させる設定
[tool.hatch.build.targets.wheel]
packages = ["lib"]

# pytorch index url
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# strict pytorch to be installed from "pytorch-cu130"
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
