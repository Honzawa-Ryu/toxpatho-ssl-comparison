# ============================================================
# Experiment Configuration — exp 0044(andre01 で実行。Miyabi では回さない)
# ============================================================
# SimSiam 0038 の「学習が完了しているか」を表現の側から判定する。0027(DINO)と同じ固定 2,000 パッチ
# (val fold 200 WSI × 10 枚)で、5 epoch ごとの 32 スナップショットの埋め込みを取り、
#   - 隣り合う epoch 間の CKA(→ 1 に張り付けば表現はもう動いていない)
#   - η²_slide / η²_color、実効ランク、k-means の ARI/NMI の推移
# を出す。0038 の学習ログでは、lr が 0 に向かう最後の 40 epoch で損失が −0.957 → −0.884 と上がり、z の実効ランクが
# 30 → 187 と増え続けていた(backbone の実効ランクは ep130 以降 72〜76 で横ばい)ので、表現が収束したかは学習ログだけでは決まらない。
# ============================================================

seed: 42  # パッチ選択はRNGを使わない。k-means等の乱数は lib/analysis/common.SEED 側。

# --- 手法 -> チェックポイント対応表（PROJECT_ROOT からの相対パス）---
methods_config: scripts/analysis/simsiam_epochs.yaml

# --- パッチ集合 ---
# 学習と同じ WSI 単位 fold 分割の val 側だけを使う（事前学習で重みを更新していない WSI = 200 枚）。
# 0038 も既定の fold 0 / 5 分割で学習している。データ位置は DATASET_DIR に従う。
per_slide: 10   # 1スライドあたり枚数。200 WSI x 10 = 2000枚
fold_idx: 0
num_folds: 5

# --- 埋め込み ---
batch_size: 256

# --- 比較 ---
kmeans_k: 10
rbf_cka: false  # true にすると RBF カーネル版 CKA も出す（計算量が増える）
