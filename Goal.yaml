# ==============================================================================
# wsi-ad : TG-GATE 病理WSI 自己教師あり学習(SSL) 表現比較プロジェクト
# ==============================================================================
# 本ファイルはプロジェクトの目的・方針・成果物を定義する単一の真実源(source of truth)。
# 方針変更時はまず本ファイルを更新し、その後に実装・実験を整合させる。
# ==============================================================================

project: wsi-ad
updated: "2026-08-03"
mode: assist

goal:
  objective: |
    Open TG-GATEs（肝臓 H&E WSI, 224px パッチ）を用いて、**非対照学習(non-contrastive)** 系の
    自己教師あり学習(SSL)手法を同一条件で事前学習し、「各手法がどのような表現(representation)を
    学習しているか」を体系的に比較・分析する。

    従来の Patho-Bench による下流タスク性能ベンチマークではなく、**学習された潜在表現そのものの
    性質**に主眼を置く。すなわち「精度が高いか」ではなく「何を・どう表現しているか」を問う。

    # --------------------------------------------------------------------------
    # 方針1: 比較対象モデル（非対照学習 4手法 + 将来的に基盤モデル）
    # --------------------------------------------------------------------------
    対照学習(SimCLR 等)は負例(negative pairs)を必要とし、今回の関心（表現の質の比較）とは
    前提が異なるため **除外**する。非対照学習に分類される以下の4手法を主対象とする:
      1. SimSiam       — stop-gradient + predictor による崩壊回避（既存実装あり）
      2. Barlow Twins  — 相互相関行列の冗長性最小化（既存実装あり、健全に学習済み）
      3. MAE           — Masked Autoencoder（マスク再構成）。**ViT エンコーダが前提**（要ViT実装連携）
      4. DINO          — 自己蒸留(self-distillation)。**ViT を基本**とする
    将来拡張: 上記の比較が固まった後、病理基盤モデル **UNI**（および必要に応じ UNI-2）を
    比較軸に追加してよい（学習済み重みを用いた特徴抽出ベースの比較）。

    # 除外・整理:
    #   - SimCLR / SwAV は対照学習寄り・今回の主眼から外れるため主比較からは外す
    #     （コード・過去結果は残置。参考としての再利用は妨げない）。
    #   - `20260714_paper_swav_vitb16` は学習・チェックポイントとしては残すが、
    #     `scripts/analysis/methods_paper.yaml` の比較対象には含めない（参考枠）。
    #     （2026-08-01 明確化）

    # --------------------------------------------------------------------------
    # 方針2: 比較方法（表現の性質を多角的に評価する）
    # --------------------------------------------------------------------------
    「どのような表現を学習しているか」に興味がある。以下を用いて議論する:
      (a) 潜在空間の類似性:
          - CKA (Centered Kernel Alignment) による手法間・層間の表現類似度比較
          - 用意したパッチ集合（例: A, B, C といった性質の異なるパッチ群）に対する
            埋め込みの近接性・類似度(cosine 等)の評価
      (b) クラスタリング構造の比較:
          - 潜在空間上でのクラスタリング（例: k-means 等）の類似度
          - 手法間のクラスタ割り当て一致度を ARI (Adjusted Rand Index) 等で定量化
      (c) 定性評価（プロトタイプパッチ）:
          - 各クラスタの代表(プロトタイプ)パッチを抽出し、その見た目・組織学的特徴を
            並べて可視化し、各手法が何を捉えているかを議論する

    # --------------------------------------------------------------------------
    # 方針3: 学習終了の指標（主比較は固定エポック、崩壊監視は別途実施）
    # --------------------------------------------------------------------------
    「十分大規模なデータであれば1エポック(1回参照)で十分」という議論はあるが、その閾値は
    100万〜1000万枚オーダーと不確実。当初は early stopping を基本方針としていたが、
    主比較（`20260714_paper_*`）では **標準的な SSL 事前学習に合わせ固定エポック数
    （100 epoch）の完走を基本方針**とする（2026-08-01 実態に合わせ改訂）。
    `--early_stop` 自体は `lib/trainer/entry.py` に実装済みで、必要な実験では個別に
    有効化できる。
      - 崩壊監視: effective_rank の急落（SimSiam 等）は `rank_monitor_interval` で
        固定エポック完走とは独立に常時監視し、原因と対処を記録する
        （停止基準としてではなく、健全性チェックとして使う）

  constraints:
    - 計算資源: NVIDIA RTX A6000 (VRAM 48GB) × 最大3台（他ユーザ配慮）、混合精度(bfloat16)
    - パッチ: Open TG-GATEs 肝臓 H&E、224px、約100万枚
    - 公平性: 前処理（パッチ・拡張の基本設計）は手法間で統一する。バッチサイズ・最適化
      （optimizer/lr/weight_decay 等）は各手法の**原論文設定に忠実**に従う
      （2026-08-01 改訂: `20260714_paper_*` の paper-faithful 設定を実態として採用。
      手法間の学習条件を無理に揃えると各手法の性能を引き出せない実装になり、
      原論文の追試として不誠実になるため）
    - 実行環境: 手元の Slurm + Apptainer・単一GPU環境を主開発環境として維持しつつ
      （既存の単一GPU投入は無変更で動作すること = 後方互換必須）、スパコン
      （miyabi 等の PBS 環境）でのマルチGPU・将来的にはマルチノードDDPによる
      並列実行にも対応する（2026-08-03 追記）。時間のかかる学習は sbatch/PBS
      でジョブ投入（コンテナ内からの投入は不可、ログインノードから投入）。
      基本操作は逐次確認なしで自律実行してよい。
      移行対象の棚卸しと優先順位は `docs/multi_gpu_migration.md` を参照
      （実装計画そのものではなく着手前メモ。着手時は別途プラン化する）:
        1. `lib/trainer/distributed.py` の実装（init_process_group/DDP wrap）
           ＋ rank0ガード（entry.py の wandb.init／loop.py のcheckpoint保存・ログ）
        2. `lib/trainer/data.py`: WebDatasetシャードのrank分割
           （`split_by_node`/`split_by_worker`）とepoch長のworld_size考慮
        3. SSL手法別のgather/all_reduce有効化
           （barlowtwins.py / swav.py / dino.py、下記参照）
        4. `templates/run_slurm.sh` / `scripts/slurm_entry.sh` の
           1ノード内マルチGPU対応（`torchrun --standalone --nproc_per_node=N`）
        5. マルチノード対応（PBS/Slurm双方でのrendezvous・
           `srun`/PBS相当配下でのコンテナ起動、NCCL設定）
    - マルチGPU対応時のSSL手法別の正しさ（見落としやすい点）: GPUを増やしても
      各手法の損失がバッチ全体の統計に依存する部分をall_reduce/all_gatherしないと
      実効バッチサイズが増えず数学的に誤った損失になる。
      Barlow Twinsのcross-correlation行列、SwAVのSinkhorn-Knopp反復、
      DINOのteacher出力center更新は、いずれも現状ローカルバッチのみで計算されており
      （実装はあるが一部コメントアウトで無効化済み）、有効化が必須。
      加えてBatchNorm（ResNet50/DenseNet121バックボーン、各種ProjectionHead）は
      `SyncBatchNorm` 化を検討する（ローカルバッチ統計のままだと有効バッチサイズが
      小さいままになる）。
    - マルチGPU化と各手法の原論文条件（バッチサイズ）の関係: 現状は単一GPU制約により
      `20260714_paper_*` 全手法が batch_size=512 で実行されている
      （各手法の原論文設定に対する「忠実だが小バッチ」な妥協版。例: Barlow Twinsは
      cross-correlationがバッチ結合的なためbs512はbs2048相当のgradient
      accumulationとは等価でない旨をコード注記済み。SwAVは本来大バッチ＋
      feature queue前提で、bs512・queueなしは崩壊しやすい旨をコード注記済み）。
      マルチGPU/マルチノードDDPが有効になった段階で、各手法が前提とする
      有効バッチサイズへ近づけることを検討し、その際はLRのみでなくbatch/epoch設計
      全体を各手法のlinear scaling ruleに従って再設計する（本ファイル既存方針
      「原論文設定に忠実」の実効化であり、単純なLR再スケーリングだけでは
      不十分な場合がある点に留意）。
    - MAE は構造上 ViT バックボーンを要する。手法差とバックボーン差の交絡を避けるため、
      **主比較は4手法すべて ViT-B16 に統一**する（MAE/DINO/BarlowTwins/SimSiam を ViT で学習）。
      ResNet50 系（BT/SimSiam）の学習済みモデルは「バックボーン参照」として残し、
      BT-ViT vs BT-ResNet でバックボーン効果を、BT-ViT vs MAE-ViT で純粋な手法差を切り分ける。
      （経緯: MAE(ViT) vs BT(ResNet) の予備比較で MAE が色主導と出たが、手法由来か ViT 由来か
      切り分けるため ViT 統一に変更。2026-07-11）

  success_criteria:
    - 非対照4手法（SimSiam, Barlow Twins, MAE, DINO）が同一の TG-GATE データ・ViT-B16
      バックボーンで（学習条件は各手法の原論文設定に忠実に）事前学習され、崩壊なく
      健全な表現を得ていること（崩壊時は原因と対処を記録）。
    - 表現比較パイプラインが整備されていること: (a) CKA・埋め込み類似度、
      (b) クラスタリング一致度(ARI 等)、(c) プロトタイプパッチ可視化。
    - 固定エポック数（100 epoch）で完走し、崩壊監視（`rank_monitor_interval`）の
      結果が記録されていること。
    - 各手法の「学習した表現の性質」の差異が、上記(a)(b)(c)の定量・定性結果として
      レポートに整理されていること。
    - （拡張）UNI 等の基盤モデルを同じ比較軸に載せる準備・手順が整っていること。
    - （拡張）手元のSlurm・単一GPU環境での実行を維持したまま、スパコン
      （miyabi, PBS環境）でのマルチGPU・マルチノードDDP並列実行が可能になっており、
      各手法のall_reduce/all_gather（cross-correlation・Sinkhorn-Knopp・
      teacher center）とSyncBatchNormが有効化された状態で、各手法が原論文により
      近いバッチサイズ条件下でも崩壊なく学習できること
      （詳細は `docs/multi_gpu_migration.md`）。

outputs:
