# ============================================================
# 4 手法の最終比較(2026-10-16 更新)。各手法の本番ランの最終重み(model_ssl.pt)。
# 「論文準拠」と一語で書かない: 各ランの公式からの逸脱は PROJECT_STATUS.md / 各 run_slurm.sh を参照。
#   DINO 0028: peak lr 半減・clip 0.3(480 epoch = 論文 300 ep の step 数)
#   BT 0035:   lr_bias 1/4・clip 1.0・修正後の損失(1600 epoch = 論文 1000 ep の step 数)
#   MAE 0043:  peak lr 半減・clip 1.0(2568 epoch = 論文本文 1600 ep の step 数)。⚠️ 特徴は patch token の平均(他 3 手法は CLS)
#   SimSiam 0038: SGD 公式設定(160 epoch)。⚠️ 部分的な次元崩壊(診断 0044)。0046(SGD lr 半減)が完走したら差し替えを検討
# andre01 では Miyabi の outputs/<exp>/model_ssl.pt を同じ相対パスへコピーしてから使う(tools/andre01_copy_list.txt)。
# 旧版(0026 ep85 と、実体の無い wsi-ad の旧ラン)は git の履歴にある。
# ============================================================

methods:
  - name: dino
    ssl_name: dino
    model_name: ViTB16
    model_path: outputs/0028_20260917_dino_lr_half/model_ssl.pt
  - name: barlowtwins
    ssl_name: barlowtwins
    model_name: ViTB16
    model_path: outputs/0035_20261011_bt_vitb16_lrbias_quarter_clip1/model_ssl.pt
  - name: mae
    ssl_name: mae
    model_name: ViTB16
    model_path: outputs/0043_20261014_mae_vitb16_lr_half_clip1/model_ssl.pt
  - name: simsiam
    ssl_name: simsiam
    model_name: ViTB16
    model_path: outputs/0038_20261012_simsiam_vitb16_step_matched/model_ssl.pt
