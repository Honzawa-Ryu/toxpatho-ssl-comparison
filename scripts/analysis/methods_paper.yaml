# ============================================================
# 表現比較（paper 版, ViT-B/16 統一）の手法 -> チェックポイント対応表
#
# `lib/analysis/embeddings.py: run()` が読む methods_config。
# 主比較は Goal.yaml 方針1により非対照学習4手法（Barlow Twins/SimSiam/MAE/DINO）
# に限定する。SwAV（対照学習寄り）は主比較から除外するため、ここには含めない。
#
# 現状は DINO 単独の epoch 推移比較。理由:
#   - 他3手法（Barlow Twins / MAE / SimSiam）の重みは旧クラスタの wsi-ad
#     リポジトリ側にあり、この環境には存在しない（2026-09-04 に不在を確認）。
#   - DINO 自体、事前学習6ランが全て崩壊しており、比較に出せる重みは
#     0026（clip_grad 0.3）の崩壊前スナップショットだけ。ep90 で吸収状態に
#     入っているので ep85 が最後の健全な点（PROJECT_STATUS.md「🦕 DINO崩壊調査」）。
# まず「ep85 の表現が他手法と比較する価値があるか」を ep 推移で判定し、
# 価値があると分かってから他手法の重みを揃える。
#
# model_path は PROJECT_ROOT からの相対パス。旧版は別クラスタの絶対パス
# (/workspace/andre01/honzawa/wsi-ad/...) を指しており、環境が変わった時点で
# 全手法 skip される状態になっていた。相対パスにして同じ事故を避ける。
# ============================================================

methods:
  - name: dino_ep20
    ssl_name: dino
    model_name: ViTB16
    model_path: outputs/0026_20260901_dino_clipgrad03/model_ep20.pt

  - name: dino_ep50
    ssl_name: dino
    model_name: ViTB16
    model_path: outputs/0026_20260901_dino_clipgrad03/model_ep50.pt

  - name: dino_ep85
    ssl_name: dino
    model_name: ViTB16
    model_path: outputs/0026_20260901_dino_clipgrad03/model_ep85.pt
