# ============================================================
# DINO 0026(clip_grad 0.3) の epoch 掃引用チェックポイント一覧
#
# `lib/analysis/embeddings.py: run()` が読む methods_config。
# 「手法 -> チェックポイント」ではなく「同一手法の epoch -> チェックポイント」を
# 並べる用途なので、4手法比較用の methods_paper.yaml とは分けてある。
#
# 0026 は ep90 で吸収状態(train_loss = ln(65536) = 11.0904, grad_norm 2e-4)に入り
# ep94 で abort している。ep90/ep95 は崩壊後なので表現としては使えないが、
# 指標(η²_slide / CKA)が崩壊を検出できるかの確認のため意図的に含めてある。
# 健全な範囲は ep85 まで(PROJECT_STATUS.md「🦕 DINO崩壊調査」)。
# ============================================================

